steps:
  # Step 1: Build the Docker image from the project root
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_IMAGE_NAME:$COMMIT_SHA'
      - '-t'
      - '$_IMAGE_NAME:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Step 2: Push both tags to the registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_IMAGE_NAME:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_IMAGE_NAME:latest']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_IMAGE_NAME:$COMMIT_SHA'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--service-account'
      - '$_RUNTIME_SERVICE_ACCOUNT'
      - '--add-cloudsql-instances'
      - '$_CLOUD_SQL_INSTANCE'
      # Rooms are currently held in server memory. Keep Cloud Run on one
      # instance so create/find/join requests see the same room store.
      - '--max-instances'
      - '1'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'APP_ENV=$_APP_ENV,IDENTITY_PLATFORM_PROJECT_ID=$PROJECT_ID,FIREBASE_API_KEY=$_FIREBASE_API_KEY,FIREBASE_AUTH_DOMAIN=$_FIREBASE_AUTH_DOMAIN,FIREBASE_APP_ID=$_FIREBASE_APP_ID'
      - '--update-secrets'
      - 'DATABASE_URL=$_DATABASE_URL_SECRET:latest,AUTH_SIGNING_KEY=$_AUTH_SIGNING_KEY_SECRET:latest'

substitutions:
  # Override these in the Cloud Build trigger settings
  _IMAGE_NAME: 'gcr.io/$PROJECT_ID/brainfuck-chess-server'
  _SERVICE_NAME: 'brainfuck-chess'
  _REGION: 'us-central1'
  _APP_ENV: 'prod'
  _DATABASE_URL_SECRET: 'deck-chess-database-url'
  _AUTH_SIGNING_KEY_SECRET: 'deck-chess-auth-signing-key'
  _CLOUD_SQL_INSTANCE: '$PROJECT_ID:us-central1:deck-chess-postgres'
  _RUNTIME_SERVICE_ACCOUNT: 'deck-chess-runtime@$PROJECT_ID.iam.gserviceaccount.com'
  # Public Identity Platform web configuration. Override in the build trigger.
  _FIREBASE_API_KEY: 'configure-in-build-trigger'
  _FIREBASE_AUTH_DOMAIN: '$PROJECT_ID.firebaseapp.com'
  _FIREBASE_APP_ID: 'configure-in-build-trigger'

images:
  - '$_IMAGE_NAME:$COMMIT_SHA'
  - '$_IMAGE_NAME:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
