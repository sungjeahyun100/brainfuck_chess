<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">기관총 사수</title>
  <desc id="desc">흰색 방탄모를 쓴 사수와 탄약통, 삼각대가 달린 기관총을 검은 윤곽선으로 그린 픽토그램</desc>
  <g fill="#fff" stroke="#111" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- helmeted gunner -->
    <path d="M151 189 C154 119 194 75 256 75 C318 75 358 119 361 189 L382 211 H130 Z"/>
    <path d="M137 211 C181 184 331 184 375 211" fill="none"/>
    <path d="M181 213 V238 C181 281 212 310 256 310 C300 310 331 281 331 238 V213 Z"/>
    <!-- machine-gun butt, receiver, barrel, and muzzle -->
    <path d="M66 260 L123 228 H151 V304 H123 L66 282 Z"/>
    <rect x="139" y="228" width="190" height="78" rx="12"/>
    <path d="M329 245 H443 V276 H329 Z"/>
    <path d="M443 234 H471 V287 H443 Z"/>
    <path d="M178 228 V204 H246 V228"/>
    <!-- grip and ammunition box -->
    <path d="M279 306 L302 355 H265 L247 306 Z"/>
    <path d="M154 306 H234 V377 H166 Z"/>
    <path d="M171 328 H218 M174 350 H222" fill="none" stroke-width="12"/>
    <!-- tripod -->
    <circle cx="326" cy="319" r="19"/>
    <path d="M319 337 L249 443" fill="none" stroke-width="20"/>
    <path d="M333 337 L405 443" fill="none" stroke-width="20"/>
    <path d="M302 341 L323 443" fill="none" stroke-width="18"/>
    <path d="M226 450 H272 M382 450 H428 M302 450 H345" fill="none" stroke-width="20"/>
    <!-- shoulders behind the weapon -->
    <path d="M176 378 L126 403 C111 411 99 429 94 458 H242"/>
  </g>
</svg>
